<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tidyra brand mark — single source of truth for the logo.

  Concept: a folder whose contents are already sorted into tidy rows.
  Designed to read at favicon size (16 px) and at full header size (>= 64 px).

  Palette
    primary   #0F766E   deep teal   — folder body (works on light + dark)
    accent    #5EEAD4   light teal  — file cards (high-contrast on primary)

  No raster fallback ships in-tree. If a target platform needs a
  rasterized icon (Windows .ico, macOS .icns, PNG favicon), export from
  this file at the required sizes. See docs/docs/frontend/invariants/frontend.md
  for the "where the logo lives" guidance.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-label="Tidyra logo">
  <title>Tidyra</title>

  <!-- Folder body: tab on top-left, larger body underneath.
       Drawn as a single path so the corner where the tab meets the
       body stays seamless at any scale. -->
  <path d="M8 14
           H24
           L28 18
           H56
           V52
           H8
           Z"
        fill="#0F766E"/>

  <!-- Three tidied file cards. Equal corner radii, descending widths
       so the eye reads "sorted" without literal labels. -->
  <rect x="14" y="26" width="36" height="5" rx="1.5" fill="#5EEAD4"/>
  <rect x="14" y="34" width="28" height="5" rx="1.5" fill="#5EEAD4" fill-opacity="0.72"/>
  <rect x="14" y="42" width="32" height="5" rx="1.5" fill="#5EEAD4" fill-opacity="0.86"/>
</svg>