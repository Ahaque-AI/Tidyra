# Tidyra — built-in default rules.
#
# Override any of these by dropping your own rules.toml at the user config
# directory or a rules.toml in the current working directory. User rules
# override defaults by `name`.
#
# Rule schema (TOML):
#
#   [[rule]]
#   name           — stable identifier (overrides by name)
#   destination    — folder relative to the scan root; supports
#                    templates `{date}`, `{year}`, `{month}`, `{ext}`, `{stem}`
#                    expanded from each file's mtime/name.
#   extensions     — optional list of file extensions this rule matches
#                    (e.g. `[".jpg", ".png"]`). Case-insensitive.
#   name_patterns  — optional list of glob patterns the file name must
#                    match. Case-insensitive. Use `["*"]` for a catch-all.
#   name_regexes   — optional list of case-insensitive regular expressions
#                    matched against the file name.
#   topic_regex    — optional case-insensitive regex with a named `topic`
#                    capture; use that capture as `{topic}` in destination.
#   priority       — higher wins; ties produce RULE_CONFLICT.
#
# Matching is deterministic: glob patterns and regular expressions are
# alternative name matchers; if extensions and a name matcher are present,
# both must match. The highest-priority matching rule wins; a same-priority
# tie is skipped as a conflict.
#
# The catch-all is the rule with `priority = 0` and `name_patterns = ["*"]`.
# Files that match no rule appear in the preview as `unmatched` and are
# not moved — see the configuration docs for the schema.

# ----- Trips: high-priority vacation photos beat the generic photo rule -----

[[rule]]
name = "vacation-photos"
destination = "{date}/Photos/Trips/Vacation"
name_regexes = ["\\b(vacation|trip|holiday)\\b"]
extensions = [".jpg", ".jpeg", ".png", ".heic", ".mov", ".mp4"]
priority = 50

# ----- Specific document-class heuristics -----

[[rule]]
name = "tax-documents"
destination = "{date}/Documents/Finance/Tax"
name_regexes = ["\\b(tax|1099|w-?2)\\b"]
priority = 45

[[rule]]
name = "invoices"
destination = "{date}/Documents/Finance/Invoices"
name_regexes = ["\\b(invoice|receipt|bill)\\b"]
priority = 40

# ----- Screenshots: detected by name on any platform -----

[[rule]]
name = "screenshots"
destination = "{date}/Images/Screenshots"
name_regexes = ["^(screenshot|screen shot|capture|snip)"]
priority = 30

# ----- RAW photos win over generic photo bucketing -----

[[rule]]
name = "raw-photos"
destination = "{date}/Photos/RAW"
extensions = [".cr2", ".cr3", ".nef", ".arw", ".dng", ".orf", ".rw2", ".raw"]
priority = 25

# ----- Generic media categories -----

# ----- Application bundles: shared name prefix becomes the topic folder. -----

[[rule]]
name = "application-bundles"
destination = "{date}/Applications/{topic}"
topic_regex = "^(?P<topic>[A-Za-z][A-Za-z0-9]*)(?:[-_. ]|$)"
extensions = [".exe", ".msi", ".dll", ".sys", ".pdb", ".bin", ".dat", ".conf", ".ini"]
priority = 20

[[rule]]
name = "music"
destination = "{date}/Music"
extensions = [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a", ".opus", ".wma", ".aiff"]
priority = 10

[[rule]]
name = "videos"
destination = "{date}/Videos"
extensions = [".mp4", ".mkv", ".mov", ".avi", ".webm", ".wmv", ".flv", ".m4v"]
priority = 10

[[rule]]
name = "archives"
destination = "{date}/Archives"
extensions = [".zip", ".tar", ".gz", ".bz2", ".xz", ".7z", ".rar", ".tgz"]
priority = 10

[[rule]]
name = "documents"
destination = "{date}/Documents"
extensions = [".pdf", ".docx", ".txt", ".xlsx", ".pptx", ".odt", ".md", ".rtf", ".csv", ".epub"]
priority = 10

[[rule]]
name = "applications"
destination = "{date}/Applications"
extensions = [".exe", ".msi", ".dmg", ".pkg", ".deb", ".rpm", ".apk", ".appimage"]
priority = 10

[[rule]]
name = "code"
destination = "{date}/Code"
extensions = [
  ".py", ".js", ".ts", ".tsx", ".jsx",
  ".go", ".rs", ".java", ".kt", ".swift",
  ".c", ".cpp", ".h", ".hpp", ".cs",
  ".rb", ".php", ".sh", ".ps1",
  ".html", ".css", ".scss",
  ".sql", ".yaml", ".yml", ".json", ".toml", ".xml",
]
priority = 10

# ----- Images share one topic folder, regardless of their format. -----

[[rule]]
name = "images"
destination = "{date}/Images"
extensions = [".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp", ".tiff", ".heic"]
priority = 5

# ----- Catch-all: every other file → Misc. Priority 0 is the lowest
#       so anything more specific overrides it. `name_patterns = ["*"]`
#       matches every filename (equivalent to the legacy
#       `always_matches = true`). -----

[[rule]]
name = "other"
destination = "{date}/Misc"
name_patterns = ["*"]
priority = 0
