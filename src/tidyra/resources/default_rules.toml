# ----- Images share one topic folder, regardless of their format. -----

[[rule]]
name = "images"
destination = "{date}/Images"
extensions = [".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp", ".tiff", ".heic"]
priority = 5

# ----- Catch-all: every other file → Needs Review/<extension>.
#       Priority 0 is the lowest
#       so anything more specific overrides it. `name_patterns = ["*"]`
#       matches every filename (equivalent to the legacy
#       `always_matches = true`). -----

[[rule]]
name = "other"
destination = "{date}/Needs Review/{ext}"
name_patterns = ["*"]
priority = 0
